services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ajaia
      POSTGRES_PASSWORD: ajaia
      POSTGRES_DB: ajaia_docs
    ports:
      - "5433:5432"
    volumes:
      - ajaia-pg:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

volumes:
  ajaia-pg:
